<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Locator — Tenaye Info</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS for Interactive OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Required i18n Libraries -->
  <script src="https://unpkg.com/i18next@23.7.11/dist/umd/i18next.min.js"></script>
  <script src="https://unpkg.com/i18next-http-backend@2.4.2/i18nextHttpBackend.min.js"></script>

  <style>
    /* Sticky Map Constraints */
    #map { height: calc(100vh - 200px); min-height: 500px; max-height: 700px; z-index: 10; }
    
    /* Touch Target Minimums (WCAG) */
    .touch-target { min-width: 44px; min-height: 44px; }
    
    /* Custom Marker Hover Animation */
    .custom-medical-cross-marker { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .custom-medical-cross-marker.hover-highlight {
      transform: scale(1.2) translateY(-5px) !important;
      box-shadow: 0 8px 15px rgba(5, 150, 105, 0.4) !important;
      z-index: 1000 !important;
    }
  </style>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f5f3ff',
              100: '#ede9fe',
              800: '#8b5cf6',
              900: '#7c3aed',
              950: '#6d28d9',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-navy-50 font-sans text-navy-900 antialiased min-h-screen flex flex-col justify-between">

  <!-- Navbar Placeholder -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- Hero Header -->
    <div class="text-center max-w-3xl mx-auto mb-8">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-gold-100 text-navy-900 mb-2">
        <span>📍</span> Location-Based Healthcare
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-2" data-i18n="pharmacy.title">
        Nearby Pharmacy Locator
      </h1>
      <p class="text-slate-600 text-sm sm:text-base" data-i18n="pharmacy.subtitle">
        Find verified, licensed pharmacies near your location across Ethiopia.
      </p>
    </div>

    <!-- Responsive Control Bar -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-8">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        
        <!-- Location Action & Status (Left) -->
        <div class="w-full md:w-auto flex flex-col sm:flex-row items-start sm:items-center gap-3 shrink-0">
          <button id="use-location-btn" 
                  aria-label="Use My Current Location"
                  class="touch-target w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-navy-900 hover:bg-navy-950 focus:ring-4 focus:ring-gold-400/50 text-white text-sm font-bold rounded-xl shadow transition-all cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"></path></svg>
            <span data-i18n="pharmacy.useLocationBtn">Locate Me</span>
          </button>
          <div id="location-status" class="text-sm font-medium text-slate-600">📍 Loading location...</div>
        </div>

        <!-- Mobile Filter Toggle Button -->
        <button id="mobile-filter-toggle" class="touch-target md:hidden w-full flex items-center justify-between px-4 py-2 bg-slate-100 rounded-xl text-slate-700 font-semibold border border-slate-200">
          <span>⚙️ Filter & Sort Options</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <!-- Interactive Filters (Search, 24/7, Sort Groups) -->
        <div id="filter-panel" class="hidden md:flex flex-col md:flex-row flex-wrap items-center gap-3 w-full md:w-auto">
          
          <!-- Search Input -->
          <div class="relative w-full md:w-56">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
            </div>
            <input type="text" 
                   id="pharmacy-search-input" 
                   aria-label="Search pharmacy name or address"
                   placeholder="Search pharmacy..." 
                   class="touch-target pl-9 pr-3 py-2 w-full bg-navy-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition-all placeholder-slate-400" />
          </div>

          <!-- Open 24/7 Toggle -->
          <button id="filter-247-btn" aria-label="Toggle Open 24/7 Only" class="touch-target w-full md:w-auto px-4 py-2 bg-slate-100 hover:bg-navy-50 text-slate-700 hover:text-gold-600 border border-slate-300 rounded-xl text-sm font-semibold transition-all cursor-pointer flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-navy-500 hidden" id="filter-247-indicator"></span>
            <span>🌙</span> <span>24/7 Only</span>
          </button>

          <!-- Grouped Sort & Radius View -->
          <div class="flex bg-slate-100 rounded-xl border border-slate-300 p-0.5 w-full md:w-auto">
            <!-- Strict Radius -->
            <select id="radius-filter-select" aria-label="Distance Radius Filter" class="touch-target bg-transparent border-none text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-gold-500 rounded-lg pl-3 pr-8 w-full md:w-32 cursor-pointer border-r border-slate-300 pr-2">
              <option value="10" selected>Within 10 km</option>
              <option value="5">Within 5 km</option>
              <option value="3">Within 3 km</option>
              <option value="25">Within 25 km</option>
            </select>
            <!-- Sort -->
            <select id="sort-select" aria-label="Sort by" class="touch-target bg-transparent border-none text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-gold-500 rounded-lg pl-3 pr-8 w-full md:w-36 cursor-pointer">
              <option value="distance">Nearest First</option>
              <option value="name">Name (A-Z)</option>
            </select>
          </div>

        </div>

      </div>
    </div>

    <!-- Main 2-Column Layout (Interactive Map & Scrolling List) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative">
      
      <!-- Interactive Leaflet Map (Left Column - 45% width on sticky) -->
      <div class="lg:col-span-5 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 lg:sticky lg:top-4 h-auto lg:h-[calc(100vh-120px)] flex flex-col">
        <div class="flex items-center justify-between mb-3 px-1 shrink-0">
          <h2 class="font-bold text-navy-900 text-sm flex items-center gap-1.5">
             <svg class="w-4 h-4 text-gold-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            Interactive Map
          </h2>
          <span class="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">CartoDB & Esri</span>
        </div>
        
        <!-- Map Container -->
        <div id="map" class="rounded-xl overflow-hidden shadow-inner border border-slate-100 flex-grow w-full"></div>

        <!-- Accuracy Legend -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between text-[11px] text-slate-500 mt-3 px-2 gap-2 shrink-0">
          <span class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full bg-blue-500/20 border border-blue-400"></span>
            <span>Shaded circle = location accuracy range</span>
          </span>
          <span class="text-slate-400 font-medium">💡 Drag pin to reposition</span>
        </div>
      </div>

      <!-- Pharmacy Scrollable List (Right Column - 55% width) -->
      <div class="lg:col-span-7">
        <div class="flex items-center justify-between mb-4 px-1">
          <h2 class="font-bold text-navy-900 text-lg flex items-center gap-1.5">
            Results (<span id="results-count" class="text-gold-600">0</span>)
          </h2>
          <div id="list-status" class="text-xs text-slate-500 font-medium"></div>
        </div>

        <!-- Loading State -->
        <div id="pharmacy-loading" class="hidden text-center py-20 bg-white rounded-2xl border border-slate-100 shadow-sm">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-[3px] border-gold-500 border-t-transparent mb-4"></div>
          <p class="text-sm font-semibold text-slate-700">Fetching local pharmacies...</p>
        </div>

        <!-- List Container -->
        <div id="pharmacy-list-container" class="grid grid-cols-1 gap-4 pb-20">
          <!-- Dynamically Rendered Pharmacy Cards -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer Placeholder -->
  <div id="footer-container"></div>

  <!-- Application Scripts -->
  <script src="/src/js/utils/auth.js"></script>
  <script src="/src/js/i18n.js"></script>
  <script src="/src/js/components/languageSwitcher.js"></script>
  <script src="/src/js/components/navbar.js"></script>
  <script src="/src/js/components/footer.js"></script>
  
  <!-- Chat Widget Scripts -->
  <script src="/src/js/services/api.js"></script>
  <script src="/src/js/services/chatbotService.js"></script>
  <script src="/src/js/components/chatBubble.js"></script>
  <script src="/src/js/components/chatWidget.js"></script>

  <script src="/src/js/components/pharmacyListItem.js"></script>
  <script src="/src/js/services/pharmacyService.js"></script>
  <script src="/src/js/pages/pharmacyLocator.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Navbar and Footer rendering if not already handled by page JS
      const navContainer = document.getElementById('navbar-container');
      if (navContainer && navContainer.innerHTML === '' && typeof renderNavbar === 'function') {
        navContainer.appendChild(renderNavbar());
      }
      const footerContainer = document.getElementById('footer-container');
      if (footerContainer && footerContainer.innerHTML === '' && typeof renderFooter === 'function') {
        footerContainer.appendChild(renderFooter());
      }
      
      // Initialize Chat Widget
      if (typeof renderChatWidget === 'function') {
        document.body.appendChild(renderChatWidget());
        initChatWidget();
      }
    });
  </script>
</body>
</html>
