<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - Tenaye Info</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "Inter", "sans-serif"],
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans selection:bg-emerald-200">

    <!-- Navbar Placeholder -->
    <div id="navbar-container"></div>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col relative h-[calc(100vh-64px)]">
        <div class="text-center mb-6 mt-2">
            <h1 class="text-2xl font-bold text-slate-800">Chat with Tenaye AI</h1>
            <p class="text-sm text-slate-500 mt-1 max-w-md mx-auto">
                Educational information only — always consult a doctor or pharmacist for medical decisions.
            </p>
        </div>

        <div id="chat-window" class="flex-1 overflow-y-auto mb-20 px-2 scroll-smooth"
            style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;"></div>

        <div class="absolute bottom-4 left-4 right-4 md:left-6 md:right-6">
            <form id="chat-form"
                class="flex items-end gap-2 bg-white rounded-2xl shadow-lg shadow-[#172554]/10 p-2 border border-slate-200">
                <input type="text" id="message-input" placeholder="Ask about a medicine..." required
                    class="flex-1 bg-transparent border-0 px-4 py-3 focus:ring-0 outline-none text-slate-700 placeholder-slate-400"
                    autocomplete="off" />
                <button type="submit"
                    class="bg-[#172554] text-[#D4AF37] p-3 rounded-xl hover:bg-blue-950 hover:text-yellow-400 transition-colors flex items-center justify-center shrink-0 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="w-5 h-5 -rotate-90">
                        <path
                            d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script src="../src/js/utils/auth.js"></script>
    <script src="../src/js/components/navbar.js"></script>
    <script src="../src/js/components/languageSwitcher.js"></script>
    <script src="../src/js/services/api.js"></script>
    <script src="../src/js/services/chatbotService.js"></script>
    <script src="../src/js/components/chatBubble.js"></script>
    <script src="../src/js/pages/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navContainer = document.getElementById('navbar-container');
            if (navContainer && typeof renderNavbar === 'function') {
                navContainer.appendChild(renderNavbar());
            }
        });
    </script>
</body>

</html>
