<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicine Details - Tenaye Info</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
  <script src="https://unpkg.com/i18next@23.7.11/dist/umd/i18next.min.js"></script>
  <script src="https://unpkg.com/i18next-http-backend@2.4.2/i18nextHttpBackend.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f5f3ff',
              100: '#ede9fe',
              800: '#8b5cf6',
              900: '#7c3aed',
              950: '#6d28d9',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-navy-50 font-sans selection:bg-gold-400 selection:text-navy-900 text-navy-900 min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-12 flex flex-col items-center">
    
    <div class="w-full flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold text-navy-950">Search Results</h1>
      <a href="medicine-search.html" class="px-4 py-2 bg-navy-100 text-navy-900 rounded-lg hover:bg-navy-200 transition-colors font-semibold text-sm">
        ← Back to Search
      </a>
    </div>

    <!-- Results Container -->
    <div id="results" class="w-full max-w-2xl">
      <div class="text-center p-8">
        <p class="text-navy-800 font-medium">Loading results...</p>
      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <script src="../src/js/utils/auth.js"></script>
  <script src="../src/js/i18n.js"></script>
  <script src="../src/js/components/navbar.js"></script>
  <script src="../src/js/components/footer.js"></script>
  <script src="../src/js/components/languageSwitcher.js"></script>
  <script src="../src/js/services/api.js"></script>
  <script src="../src/js/services/chatbotService.js"></script>
  <script src="../src/js/components/chatBubble.js"></script>
  <script src="../src/js/components/chatWidget.js"></script>
  <script src="../src/js/components/medicineCard.js"></script>
  <script src="../src/js/pages/medicineDetails.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navContainer = document.getElementById('navbar-container');
      if (navContainer && typeof renderNavbar === 'function') {
        navContainer.appendChild(renderNavbar());
      }
      const footerContainer = document.getElementById('footer-container');
      if (footerContainer && typeof renderFooter === 'function') {
        footerContainer.appendChild(renderFooter());
      }
      if (typeof renderChatWidget === 'function') {
        document.body.appendChild(renderChatWidget());
        initChatWidget();
      }
    });
  </script>
</body>

</html>
