<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Tenaye Info</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f5f3ff',
              100: '#ede9fe',
              800: '#8b5cf6',
              900: '#7c3aed',
              950: '#6d28d9',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-navy-50 font-sans selection:bg-gold-400 selection:text-navy-900 text-navy-900 min-h-screen flex items-center justify-center relative py-12 overflow-x-hidden">

  <!-- Premium Background Blobs -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute top-[-10%] left-[10%] w-[30%] h-[40%] rounded-full bg-navy-800/10 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[10%] w-[40%] h-[40%] rounded-full bg-gold-400/10 blur-[120px]"></div>
  </div>



  <!-- Register Card -->
  <div class="w-full max-w-3xl px-4 z-0">
    <div class="bg-white/90 backdrop-blur-xl p-8 sm:p-12 rounded-[2rem] shadow-2xl border border-white/50 relative overflow-hidden group">
      

      
      <div class="text-center mb-10 pt-2">
        <a href="index.html" class="inline-flex items-center justify-center w-16 h-16 bg-navy-50 rounded-2xl mb-4 shadow-inner border border-white hover:scale-105 transition-transform" title="Back to Home">
          <span class="text-3xl drop-shadow-sm">✨</span>
        </a>
        <h1 class="text-3xl sm:text-4xl font-bold text-navy-950 mb-3">Create an Account</h1>
        <p class="text-slate-500 font-medium text-sm sm:text-base max-w-md mx-auto">Join Tenaye Info today to get personalized medicine guidance.</p>
      </div>

      <form id="register-form" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Full Name *</label>
            <input type="text" id="fullName" required placeholder="John Doe"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Email Address *</label>
            <input type="email" id="email" required placeholder="name@example.com"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
          </div>

          <div>
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Age *</label>
            <input type="number" id="age" min="0" required placeholder="e.g. 25"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
          </div>

          <div>
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Gender *</label>
            <select id="gender" required
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm">
              <option value="">Select...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Phone Number *</label>
            <input type="tel" id="phoneNumber" placeholder="+251..." required
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
          </div>

          <div>
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Home Address *</label>
            <input type="text" id="homeAddress" placeholder="City, Region..." required
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
          </div>

          <div class="md:col-span-1">
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Password *</label>
            <div class="relative">
              <input type="password" id="password" required minlength="6" placeholder="••••••••"
                class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 pr-12 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
              <button type="button" class="toggle-password absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-navy-900 focus:outline-none transition-colors" data-target="password">
                <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
            </div>
          </div>

          <div class="md:col-span-1">
            <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Confirm Password *</label>
            <div class="relative">
              <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••"
                class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3.5 pr-12 focus:ring-2 focus:ring-gold-400 outline-none transition-all shadow-sm" />
              <button type="button" class="toggle-password absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-navy-900 focus:outline-none transition-colors" data-target="confirmPassword">
                <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
            </div>
          </div>
        </div>

        <p id="error-message" class="text-red-500 text-sm font-medium hidden text-center bg-red-50 py-2 rounded-lg"></p>

        <button type="submit"
          class="w-full bg-navy-900 text-gold-400 font-bold py-4 rounded-xl hover:bg-navy-800 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 mt-4 text-lg">
          Create Account
        </button>
      </form>

      <p class="text-sm text-center mt-8 text-slate-500 font-medium">
        Already have an account? <a href="login.html" class="text-gold-600 font-bold hover:text-gold-500 underline decoration-2 underline-offset-4">Log in</a>
      </p>
    </div>
  </div>

  <!-- OTP Verification Modal (Hidden as email verification is bypassed, but kept for JS compatibility) -->
  <div id="otp-modal"
    class="fixed inset-0 bg-navy-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-white/50 relative">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-navy-50 text-navy-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-navy-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-navy-950 mb-2">Verify your email</h2>
        <p class="text-sm text-slate-500 font-medium" id="otp-email-display">We've sent a 6-digit code to your email.</p>
      </div>

      <form id="otp-form" class="space-y-5">
        <div>
          <input type="text" id="otp-input" maxlength="6" required placeholder="••••••"
            class="w-full text-center text-3xl tracking-[0.5em] font-bold border-b-2 border-slate-200 px-3 py-3 focus:border-gold-400 outline-none bg-transparent" />
        </div>
        <p id="otp-error-message" class="text-red-500 text-sm hidden text-center font-medium"></p>
        <button type="submit"
          class="w-full bg-navy-900 text-gold-400 font-bold py-3 rounded-xl hover:bg-navy-800 transition-all shadow-md">
          Verify
        </button>
      </form>
    </div>
  </div>

  <script src="../src/js/i18n.js"></script>
  <script src="../src/js/components/languageSwitcher.js"></script>
  <script src="../src/js/utils/auth.js"></script>
  <script src="../src/js/services/api.js"></script>
  <script src="../src/js/services/authService.js"></script>
  <script src="../src/js/pages/register.js"></script>
</body>

</html>
