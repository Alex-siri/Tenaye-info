<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Tenaye Info</title>
  <script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f0f4f8',
              100: '#d9e2ec',
              800: '#1e3a8a',
              900: '#172554',
              950: '#0B132B',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-navy-50 font-sans selection:bg-gold-400 selection:text-navy-900 text-navy-900 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border border-slate-100">
    <h1 class="text-2xl font-semibold mb-6 text-center">💊 Tenaye Info</h1>

    <form id="register-form" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Full Name *</label>
          <input type="text" id="fullName" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Email *</label>
          <input type="email" id="email" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Age *</label>
          <input type="number" id="age" min="0" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Gender *</label>
          <select id="gender" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all bg-white">
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Phone Number *</label>
          <input type="tel" id="phoneNumber" placeholder="+251..." required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Home Address *</label>
          <input type="text" id="homeAddress" placeholder="City, Region..." required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Password *</label>
          <input type="password" id="password" required minlength="6"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all" />
        </div>
      </div>

      <p id="error-message" class="text-red-600 text-sm hidden"></p>

      <button type="submit"
        class="w-full bg-navy-900 text-gold-400 font-bold py-2 rounded hover:bg-navy-950 transition-colors">
        Create Account
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      Already have an account? <a href="login.html" class="text-gold-600 font-semibold hover:text-gold-500">Login</a>
    </p>
  </div>

  <!-- OTP Verification Modal -->
  <div id="otp-modal"
    class="fixed inset-0 bg-navy-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gold-100 text-gold-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
            </path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-navy-900 mb-2">Verify your email</h2>
        <p class="text-sm text-navy-600" id="otp-email-display">We've sent a 6-digit code to your email.</p>
      </div>

      <form id="otp-form" class="space-y-4">
        <div>
          <input type="text" id="otp-input" maxlength="6" required placeholder="------"
            class="w-full text-center text-3xl tracking-[0.5em] font-bold border-b-2 border-slate-200 px-3 py-2 focus:border-gold-400 focus:outline-none transition-colors" />
        </div>
        <p id="otp-error-message" class="text-red-600 text-sm hidden text-center font-medium"></p>
        <button type="submit"
          class="w-full bg-navy-900 text-gold-400 font-bold py-3 rounded-lg hover:bg-navy-800 transition-colors shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
          Verify
        </button>
      </form>
    </div>
  </div>

  <script src="../src/js/i18n.js"></script>
  <script src="../src/js/components/languageSwitcher.js"></script>
  <script src="../src/js/utils/auth.js"></script>
  <script src="../src/js/services/api.js"></script>
  <script src="../src/js/services/authService.js"></script>
  <script src="../src/js/pages/register.js"></script>
</body>

</html>
