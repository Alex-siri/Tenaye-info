<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Tenaye Info</title>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <nav class="flex items-center justify-between p-4 bg-white shadow">
        <span class="font-bold text-lg">💊 Tenaye Info</span>
        <button id="logout-btn" class="text-sm text-red-600">Logout</button>
    </nav>

    <main class="p-8 max-w-md mx-auto">
        <h1 class="text-2xl font-semibold mb-6">My Profile</h1>

        <form id="profile-form" class="space-y-4 bg-white p-6 rounded-lg shadow">
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" id="fullName" disabled class="w-full border rounded px-3 py-2 bg-gray-100" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" disabled class="w-full border rounded px-3 py-2 bg-gray-100" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Gender</label>
                <select id="gender" class="w-full border rounded px-3 py-2">
                    <option value="">-- Select --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Age</label>
                <input type="number" id="age" class="w-full border rounded px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Region</label>
                <input type="text" id="region" class="w-full border rounded px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">City</label>
                <input type="text" id="city" class="w-full border rounded px-3 py-2" />
            </div>

            <p id="status-message" class="text-sm hidden"></p>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Save Changes
            </button>
        </form>
    </main>

    <script src="../src/js/utils/auth.js"></script>
    <script src="../src/js/services/api.js"></script>
    <script src="../src/js/services/userService.js"></script>
    <script src="../src/js/pages/profile.js"></script>
</body>

</html>
