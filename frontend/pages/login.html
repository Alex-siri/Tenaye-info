<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tenaye Info</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f5f3ff',
              100: '#ede9fe',
              800: '#8b5cf6',
              900: '#7c3aed',
              950: '#6d28d9',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-navy-50 font-sans selection:bg-gold-400 selection:text-navy-900 text-navy-900 min-h-screen flex items-center justify-center relative overflow-x-hidden">

  <!-- Premium Background Blobs -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[50%] rounded-full bg-navy-800/15 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[50%] rounded-full bg-gold-400/15 blur-[100px]"></div>
  </div>



  <!-- Login Card -->
  <div class="w-full max-w-md px-4">
    <div
      class="bg-white/80 backdrop-blur-xl p-10 rounded-[2rem] shadow-2xl border border-white/50 relative overflow-hidden group">



      <div class="text-center mb-8 pt-2">
        <a href="index.html"
          class="inline-flex items-center justify-center w-16 h-16 bg-transparent rounded-2xl mb-4 hover:scale-105 transition-transform"
          title="Back to Home">
          <span class="text-3xl">💊</span>
        </a>
        <h1 class="text-3xl font-bold text-navy-950 mb-2">Welcome Back</h1>
        <p class="text-slate-500 font-medium text-sm">Please enter your details to sign in.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com"
            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all shadow-sm" />
        </div>
        <div>
          <label class="block text-sm font-bold text-navy-900 mb-1.5 ml-1">Password</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-gold-400 focus:border-gold-400 outline-none transition-all shadow-sm" />
            <button type="button"
              class="toggle-password absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-navy-900 focus:outline-none transition-colors"
              data-target="password">
              <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-end pt-1">
          <button type="button" id="btn-show-forgot-password"
            class="text-sm font-semibold text-navy-800 hover:text-gold-600 transition-colors">
            Forgot Password?
          </button>
        </div>

        <p id="error-message" class="text-red-500 text-sm font-medium hidden text-center bg-red-50 py-2 rounded-lg"></p>

        <button type="submit"
          class="w-full bg-navy-900 text-gold-400 font-bold py-3.5 rounded-xl hover:bg-navy-800 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 mt-2 text-lg">
          Sign In
        </button>
      </form>

      <p class="text-sm text-center mt-8 text-slate-500 font-medium">
        Don't have an account? <a href="register.html"
          class="text-gold-600 font-bold hover:text-gold-500 underline decoration-2 underline-offset-4">Create one</a>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <!-- Kept identical structure for JS compatibility, just improved styling -->
  <div id="forgot-password-modal"
    class="fixed inset-0 bg-navy-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div
      class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-white/50 relative">
      <button type="button" id="btn-close-forgot-password"
        class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-400 rounded-full hover:bg-slate-200 hover:text-navy-900 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <!-- Step 1: Request OTP -->
      <div id="forgot-step-1">
        <div class="text-center mb-6">
          <div
            class="w-12 h-12 bg-navy-50 text-navy-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-navy-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z">
              </path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-navy-950 mb-2">Reset Password</h2>
          <p class="text-sm text-slate-500 font-medium">Enter your email address to receive a verification code.</p>
        </div>
        <form id="forgot-form" class="space-y-4">
          <div>
            <input type="email" id="forgot-email" required placeholder="name@example.com"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-gold-400 outline-none shadow-sm" />
          </div>
          <p id="forgot-error-message" class="text-red-500 text-sm font-medium hidden text-center"></p>
          <button type="submit"
            class="w-full bg-navy-900 text-gold-400 font-bold py-3 rounded-xl hover:bg-navy-800 transition-all shadow-md">
            Send Code
          </button>
        </form>
      </div>

      <!-- Step 2: Verify OTP Only -->
      <div id="forgot-step-2" class="hidden">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-navy-950 mb-2">Enter Code</h2>
          <p class="text-sm text-slate-500 font-medium" id="reset-email-display">Code sent to your email.</p>
        </div>
        <form id="verify-otp-form" class="space-y-5">
          <div>
            <input type="text" id="reset-otp" maxlength="6" required placeholder="••••••"
              class="w-full text-center text-3xl tracking-[0.5em] font-bold border-b-2 border-slate-200 px-3 py-3 focus:border-gold-400 outline-none bg-transparent" />
          </div>
          <button type="submit"
            class="w-full bg-navy-900 text-gold-400 font-bold py-3 rounded-xl hover:bg-navy-800 transition-all shadow-md">
            Verify Code
          </button>
        </form>
      </div>

      <!-- Step 3: New Password -->
      <div id="forgot-step-3" class="hidden">
        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-navy-950 mb-2">New Password</h2>
          <p class="text-sm text-slate-500 font-medium">Please enter your new password.</p>
        </div>
        <form id="reset-form" class="space-y-4">
          <div>
            <input type="password" id="reset-new-password" required minlength="6" placeholder="New Password"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-gold-400 outline-none shadow-sm" />
          </div>
          <div>
            <input type="password" id="reset-confirm-password" required minlength="6" placeholder="Confirm Password"
              class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-gold-400 outline-none shadow-sm" />
          </div>
          <p id="reset-error-message" class="text-red-500 text-sm font-medium hidden text-center"></p>
          <button type="submit"
            class="w-full bg-navy-900 text-gold-400 font-bold py-3 rounded-xl hover:bg-navy-800 transition-all shadow-md">
            Save Password
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../src/js/i18n.js"></script>
  <script src="../src/js/components/languageSwitcher.js"></script>
  <script src="../src/js/utils/auth.js"></script>
  <script src="../src/js/services/api.js"></script>
  <script src="../src/js/services/authService.js"></script>
  <script src="../src/js/pages/login.js"></script>
</body>

</html>
