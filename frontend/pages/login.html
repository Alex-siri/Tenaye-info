<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Tenaye Info</title>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@4/i18nextHttpBackend.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h1 class="text-2xl font-semibold mb-6 text-center">💊 Tenaye Info</h1>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full border rounded px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full border rounded px-3 py-2" />
            </div>

            <p id="error-message" class="text-red-600 text-sm hidden"></p>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Login
            </button>
        </form>

        <p class="text-sm text-center mt-4">
            Don't have an account? <a href="register.html" class="text-blue-600">Register</a>
        </p>
    </div>

    <script src="../src/js/utils/auth.js"></script>
    <script src="../src/js/services/api.js"></script>
    <script src="../src/js/services/authService.js"></script>
    <script src="../src/js/pages/login.js"></script>
</body>

</html>
