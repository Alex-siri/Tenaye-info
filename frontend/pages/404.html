<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found - Tenaye Info</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <script src="https://unpkg.com/i18next@23.7.11/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.4.2/i18nextHttpBackend.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Space Grotesk", "sans-serif"],
          },
          colors: {
            navy: {
              50: '#f5f3ff',
              100: '#ede9fe',
              800: '#8b5cf6',
              900: '#7c3aed',
              950: '#6d28d9',
            },
            gold: {
              400: '#FBBF24',
              500: '#D4AF37',
              600: '#B45309',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-navy-50 text-navy-900 min-h-screen flex flex-col font-sans selection:bg-gold-400 selection:text-navy-900">

    <!-- Navbar Placeholder -->
    <div id="navbar-container"></div>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col items-center justify-center text-center mt-12 mb-20">
        <div class="text-gold-500 mb-6 text-6xl">
            ⚠️
        </div>
        <h1 class="text-4xl md:text-5xl font-bold text-navy-900 mb-4" data-i18n="error.404.title">404 - Page Not Found</h1>
        <p class="text-lg text-navy-800 max-w-md mx-auto mb-8" data-i18n="error.404.message">
            Oops! The page you are looking for doesn't exist or has been moved.
        </p>
        <a href="/pages/index.html" class="bg-navy-900 text-gold-400 font-bold py-3 px-8 rounded-xl hover:bg-navy-950 transition-colors shadow-md inline-flex items-center gap-2">
            <span data-i18n="nav.home">Return Home</span> 🏠
        </a>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-container"></div>

    <script src="../src/js/utils/auth.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/components/navbar.js"></script>
    <script src="../src/js/components/footer.js"></script>
    <script src="../src/js/components/languageSwitcher.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navContainer = document.getElementById('navbar-container');
            if (navContainer && typeof renderNavbar === 'function') {
                navContainer.appendChild(renderNavbar());
            }
            const footerContainer = document.getElementById('footer-container');
            if (footerContainer && typeof renderFooter === 'function') {
                footerContainer.appendChild(renderFooter());
            }
        });
    </script>
</body>
</html>
